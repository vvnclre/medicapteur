<!doctype html>

<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-text); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .band { position:absolute; top:0; left:0; width:960px; height:112px; }
  .band svg { display:block; width:960px; height:112px; }
  .brand { fill:var(--orange); }
  .deep { fill:var(--surface-inverse); }
  .tint { fill:var(--orange-soft); }
  .plate { rx:var(--radius-plate); }
  .cell { fill:var(--orange-soft); rx:2px; }
  .cell.hot { fill:var(--orange); }
  .words { position:absolute; left:var(--space-6); right:var(--space-6); top:136px; max-width:720px; }
  .name { margin:0; font-family:var(--font-display); font-size:64px; line-height:.95; font-weight:600; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); max-width:440px; }
</style>
